name: Lean build and kernel check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    name: lake build + axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan / Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Forbidden tokens and #print axioms
        run: ./scripts/kernel_check.sh

      - name: Upload axiom certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-certificate
          path: |
            certificates/axioms.log
            certificates/SUMMARY.txt
          if-no-files-found: warn
