name = "frohmanian_tether"
version = "0.1.0"
defaultTargets = ["FrohmanianTetherConditional", "AnalyticBridgeAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0-rc1"

[[lean_lib]]
name = "FrohmanianTetherConditional"

# Refutation of the current encoding of the open analytic-bridge target, plus vacuity
# checks. Separate library because the target file and the triple-architecture file
# both declare root-level/namespace names (`HypothesisB`, `gronwall_differential_bound`)
# that would make the main audit's unqualified `#print axioms` ambiguous.
# The open-target Prop and the Truth Gate Semantics modules live here too, so the
# default `lake build` compiles every library file without polluting the main audit.
[[lean_lib]]
name = "AnalyticBridgeAudit"
roots = [
  "FrohmanianTetherConditional.AnalyticBridgeRefutation",
  "FrohmanianTetherConditional.BKMCriterionRefutation",
  "FrohmanianTetherConditional.ClassicalNS",
  "FrohmanianTetherConditional.ClassicalNSOpenTarget",
  "FrohmanianTetherConditional.FrohmanianTripleArchitectureLifespan",
  "FrohmanianTetherConditional.Semantics",
  "FrohmanianTetherConditional.SemanticsPillars",
  "FrohmanianTetherConditional.SemanticsUnifiedHs",
  "FrohmanianTetherConditional.SemanticsVacuity",
]

# The OPEN Clay (B) statement lives in FrohmanianTetherConditional/ClassicalNSOpenTarget.lean
# as a `def …Statement : Prop` with no proof. It is part of the main library and of
# every scan; it is not a separate default target and it is never excluded.
