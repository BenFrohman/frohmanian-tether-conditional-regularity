name = "frohmanian_tether"
version = "0.1.0"
defaultTargets = ["FrohmanianTetherConditional", "AnalyticBridgeAudit", "ClassicalNSOpen"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0-rc1"

[[lean_lib]]
name = "FrohmanianTetherConditional"

# Refutation of the current encoding of the open analytic-bridge target, plus vacuity
# checks. Separate library because the target file and the triple-architecture file
# both declare root-level/namespace names (`HypothesisB`, `gronwall_differential_bound`)
# that would make the main audit's unqualified `#print axioms` ambiguous.
[[lean_lib]]
name = "AnalyticBridgeAudit"
roots = [
  "FrohmanianTetherConditional.AnalyticBridgeRefutation",
  "FrohmanianTetherConditional.ClassicalNS",
  "FrohmanianTetherConditional.FrohmanianTripleArchitectureLifespan",
]

# The single honest OPEN target (Clay (B) with genuine definitions). Built so that it
# type-checks; it carries one marked placeholder proof and is excluded from the
# forbidden-token scan and from every axiom audit.
[[lean_lib]]
name = "ClassicalNSOpen"
roots = ["FrohmanianTetherConditional.ClassicalNSOpenTarget"]
